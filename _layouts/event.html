---
layout: default
---

<article class="event-article">
  <header class="event-header">
    <div class="badge-group">
      <span class="badge badge-date">{{ page.event_date }}</span>
      <span class="badge badge-space">{{ page.space }}</span>
    </div>
    <h1 class="event-title">{{ page.title }}</h1>
    <p class="event-venue">会場: {{ page.venue }}</p>
  </header>

  <div class="event-content markdown-body">
    {{ content }}
  </div>
</article>
